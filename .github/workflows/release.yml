name: Build and release Astra package

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  commits:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.list.outputs.commits }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: List every new commit in this push
        id: list
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            range="$AFTER_SHA"
          else
            range="$BEFORE_SHA..$AFTER_SHA"
          fi
          commits="$(git rev-list --reverse "$range" |
            jq -R -s -c 'split("\n") | map(select(length > 0))')"
          echo "commits=$commits" >> "$GITHUB_OUTPUT"

  release:
    needs: commits
    strategy:
      fail-fast: false
      matrix:
        commit: ${{ fromJSON(needs.commits.outputs.list) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out commit
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.commit }}

      - name: Set package version
        shell: bash
        env:
          COMMIT_SHA: ${{ matrix.commit }}
        run: |
          short_sha="${COMMIT_SHA::8}"
          echo "VERSION=0.2.0+git${GITHUB_RUN_NUMBER}.${short_sha}" >> "$GITHUB_ENV"
          echo "TAG=build-${GITHUB_RUN_NUMBER}-${short_sha}" >> "$GITHUB_ENV"

      - name: Download hash-pinned ScanSnap factory runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p vendor
          gh release download vendor-windows-4.0.0 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern bookbound.dll \
            --pattern P2IDIGCROP.dll \
            --pattern P2IATRES.DLL \
            --pattern I3ipShare.dll \
            --pattern I3ipCommon.dll \
            --dir vendor

      - name: Build Debian 10 and Astra compatible package
        shell: bash
        run: |
          docker run --rm \
            --env VERSION \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            debian:buster-slim \
            sh -euxc '
              printf "%s\n" \
                "deb http://archive.debian.org/debian buster main" \
                "deb http://archive.debian.org/debian-security buster/updates main" \
                > /etc/apt/sources.list
              printf "%s\n" "Acquire::Check-Valid-Until \"false\";" \
                > /etc/apt/apt.conf.d/99archive
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install --yes \
                autoconf autoconf-archive automake autopoint build-essential \
                ca-certificates dpkg-dev gettext git libtool \
                gcc-mingw-w64-i686 libusb-1.0-0-dev pkg-config python3
              ./packaging/build-deb.sh
            '

      - name: Verify package
        shell: bash
        run: |
          deb="$(find dist -maxdepth 1 -name '*.deb' -print -quit)"
          test -s "$deb"
          dpkg-deb --info "$deb"
          verify_root="$(mktemp -d)"
          trap 'rm -rf "$verify_root"' EXIT
          dpkg-deb --extract "$deb" "$verify_root"
          backend="$verify_root/usr/lib/x86_64-linux-gnu/sane/libsane-sv600-fujitsu.so.1"
          helper="$verify_root/usr/lib/scansnap-sv600/sv600-factory-pipeline.exe"
          resize_helper="$verify_root/usr/lib/scansnap-sv600/sv600-factory-resize.exe"
          test -s "$backend"
          test -s "$helper"
          test -s "$resize_helper"
          file "$helper" | grep -F 'PE32 executable'
          file "$resize_helper" | grep -F 'PE32 executable'
          test "$(sha256sum "$verify_root/usr/lib/scansnap-sv600/bookbound.dll" | awk '{print $1}')" = \
            9b1a74712985f8b39c6d8d382bbee9fbca9e21f5d60295ef60dcfb40acae2427
          test "$(sha256sum "$verify_root/usr/lib/scansnap-sv600/P2IDIGCROP.dll" | awk '{print $1}')" = \
            5c734ed79b29b2fd5805b96795bb4d15d8d8874f71ed9aad6d6e6094db6369c2
          test "$(sha256sum "$verify_root/usr/lib/scansnap-sv600/P2IATRES.DLL" | awk '{print $1}')" = \
            de7787c285a8b0d5f33dd1d98d895f371d1a98f77b151fb50a0f061ecb03c15b
          test "$(sha256sum "$verify_root/usr/lib/scansnap-sv600/i3ipCore/I3ipShare.dll" | awk '{print $1}')" = \
            fcf411aa7abe756a78133ea9f21c2aef122b4e3a1b9fdca9411162d4e1158c0b
          test "$(sha256sum "$verify_root/usr/lib/scansnap-sv600/i3ipCore/I3ipCommon.dll" | awk '{print $1}')" = \
            560277036290cd406917623cb3ae593ef773624667999377828050e86d6309fc
          readelf -d "$backend"
          max_glibc="$(
            objdump -T "$backend" 2>/dev/null |
              grep -oE 'GLIBC_[0-9]+\.[0-9]+' |
              sort -Vu |
              tail -1
          )"
          echo "Maximum required glibc symbol: $max_glibc"
          test -n "$max_glibc"
          if dpkg --compare-versions "${max_glibc#GLIBC_}" gt "2.28"; then
            echo "Backend requires newer glibc than Astra Linux supports" >&2
            exit 1
          fi
          sha256sum "$deb"

      - name: Publish release for this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ matrix.commit }}
        run: |
          deb="$(find dist -maxdepth 1 -name '*.deb' -print -quit)"
          sha256="$(sha256sum "$deb" | awk '{print $1}')"
          gh release create "$TAG" "$deb" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$COMMIT_SHA" \
            --title "ScanSnap SV600 ${VERSION}" \
            --latest \
            --notes "Автоматическая сборка для Astra Linux amd64.

          Установка:
          \`\`\`bash
          sudo apt install ./$(basename "$deb")
          \`\`\`

          SHA-256: \`${sha256}\`"
